version: "3.9"

# Exemplo Swarm — rede deve ser a mesma do Traefik (ex.: ferrazcon)
services:
  api:
    image: ferrazcon-api:v2
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: America/Sao_Paulo
      DATABASE_URL: file:./data/dev.db
      JWT_SECRET: "TROQUE_JWT_SECRET"
      FACIAL_THRESHOLD: "0.55"
      FACIAL_MARGIN: "0.06"
      RECOG_ENGINE: python
      RECOG_PY_URL: http://recog-py:8000
      RECOG_ALGORITHM: deepface-facenet512
      DEVICE_TOKEN: ferrazcon-device-2024
      ENABLE_SHEETS: "false"
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - api_data:/app/data
    networks:
      ferrazcon:
        aliases:
          - api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=ferrazcon
        - traefik.http.routers.timeclock-api.rule=Host(`ponto.fzccontabilidade.com.br`) && PathPrefix(`/api`)
        - traefik.http.routers.timeclock-api.entrypoints=websecure
        - traefik.http.routers.timeclock-api.tls=true
        - traefik.http.routers.timeclock-api.tls.certresolver=letsencryptresolver
        - traefik.http.services.timeclock-api.loadbalancer.server.port=4000

  frontend:
    image: ferrazcon-frontend:v2
    networks:
      - ferrazcon
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=ferrazcon
        - traefik.http.routers.timeclock-web.rule=Host(`ponto.fzccontabilidade.com.br`)
        - traefik.http.routers.timeclock-web.entrypoints=websecure
        - traefik.http.routers.timeclock-web.tls=true
        - traefik.http.routers.timeclock-web.tls.certresolver=letsencryptresolver
        - traefik.http.services.timeclock-web.loadbalancer.server.port=80

  recog-py:
    image: ferrazcon-recog-py:v1
    environment:
      MODEL_NAME: Facenet512
      DETECTOR_BACKEND: opencv
      ALGORITHM: deepface-facenet512
      DEEPFACE_HOME: /data/deepface
    volumes:
      - recog_models:/data/deepface
    networks:
      - ferrazcon
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2560M
      restart_policy:
        condition: on-failure

networks:
  ferrazcon:
    external: true

volumes:
  api_data:
  recog_models:
